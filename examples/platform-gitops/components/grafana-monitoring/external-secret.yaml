# ExternalSecret that pulls the Grafana Cloud API key from Azure Key Vault
# and creates a Kubernetes secret in the grafana-monitoring namespace.
#
# The k8s-monitoring Helm chart destinations reference this secret via
# secret.create=false and secret.name. The chart expects both "username"
# and "password" keys. Usernames differ per destination, so each is stored
# under a separate key and referenced via auth.usernameKey in the chart values.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-cloud-credentials
  namespace: grafana-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: grafana-cloud-credentials
    template:
      data:
        password: "{{ .password }}"
        # Usernames are not secret but the chart requires them in the secret.
        # Each destination references its key via auth.usernameKey.
        username-metrics: "1853314"
        username-logs: "1025942"
        username-otlp: "1068163"
        username-profiles: "1068163"
  data:
    - secretKey: password
      remoteRef:
        key: aks-dev-grafana
