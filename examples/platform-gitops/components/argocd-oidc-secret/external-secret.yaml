# ExternalSecret that pulls the Entra ID app registration client secret from
# Azure Key Vault and merges it into the well-known "argocd-secret" object
# under the key "oidc.entra.clientSecret".
#
# ArgoCD looks up "$oidc.entra.clientSecret" (referenced from oidc.config in
# argocd-cm) by reading argocd-secret. ESO's "creationPolicy: Merge" leaves
# the rest of argocd-secret (admin password, server.secretkey, etc.) intact —
# this object only owns its own key.
#
# Key Vault secret expected: "argocd-oidc-client-secret" (value = the client
# secret string from the Entra app registration). Rotate by writing a new
# version to Key Vault; ESO refreshes on the interval below.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-oidc-client-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: argocd-secret
    creationPolicy: Merge
    template:
      mergePolicy: Merge
      data:
        oidc.entra.clientSecret: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: argocd-oidc-client-secret
