# ApplicationSet that watches the team's gitops location for service directories.
# Each subdirectory under appPath becomes an Argo Application deployed to the
# team's namespace under the team's AppProject.
#
# Monorepo default: when team.repoUrl is empty, the platform repo is used and
# appPath should point at teams/<name>/services within the monorepo.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.team.name }}-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: {{ (.Values.team.repoUrl | default .Values.platform.repoUrl) | quote }}
        revision: {{ .Values.team.revision | quote }}
        directories:
          - path: "{{ .Values.team.appPath }}/*"
  template:
    metadata:
      name: "{{ .Values.team.name }}-{{`{{ .path.basename }}`}}"
      namespace: argocd
    spec:
      project: {{ .Values.team.name }}
      source:
        repoURL: {{ (.Values.team.repoUrl | default .Values.platform.repoUrl) | quote }}
        path: "{{`{{ .path.path }}`}}"
        targetRevision: {{ .Values.team.revision | quote }}
      destination:
        server: https://kubernetes.default.svc
        namespace: {{ .Values.team.name }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
