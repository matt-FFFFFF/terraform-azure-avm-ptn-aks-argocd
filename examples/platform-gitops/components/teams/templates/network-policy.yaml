# Default-deny ingress NetworkPolicy plus optional allow-from-namespace rules.
# Egress is left open (Istio AuthorizationPolicy and sidecar mTLS handle the
# rest of the data plane).
{{- if .Values.team.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.team.name }}-default-deny
  namespace: {{ .Values.team.name }}
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: platform
    platform.example.com/team: {{ .Values.team.name }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  {{- with .Values.team.networkPolicy.allowFromNamespaces }}
  ingress:
    - from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
  {{- end }}
{{- end }}
