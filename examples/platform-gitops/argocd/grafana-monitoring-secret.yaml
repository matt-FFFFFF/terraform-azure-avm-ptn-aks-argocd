# Sync Wave 1: Grafana Cloud Credentials
# Deploys the ExternalSecret that pulls the Grafana Cloud API key from
# Azure Key Vault into the grafana-monitoring namespace. Must sync after
# ESO + ClusterSecretStore (wave 0) and before k8s-monitoring (wave 2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-monitoring-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: <PLATFORM_GITOPS_REPO_URL>
    path: components/grafana-monitoring
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
