# Sync Wave 1: ArgoCD Entra OIDC Client Secret
#
# Deploys the ExternalSecret that pulls the Entra ID app registration client
# secret from Azure Key Vault into the argocd namespace. The secret is merged
# into "argocd-secret" under the key "oidc.entra.clientSecret", which is
# referenced from argocd-self-manage.yaml -> configs.cm.oidc.config.
#
# Must sync after ESO + ClusterSecretStore (wave 0) and before the self-manage
# Application (wave 3) so the secret exists when the new oidc.config is loaded.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-oidc-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: <PLATFORM_GITOPS_REPO_URL>
    path: components/argocd-oidc-secret
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
