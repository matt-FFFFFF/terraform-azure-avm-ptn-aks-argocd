# Sync Wave 2: Grafana Cloud Kubernetes Monitoring
# Deploys the grafana/k8s-monitoring Helm chart (v3) which installs multiple
# Alloy instances for metrics, logs, traces, profiles, and fleet management.
#
# Secrets: All destinations and remoteConfig use secret.create=false and
# reference the ESO-managed "grafana-cloud-credentials" secret (wave 0).
# Usernames are hardcoded; only the API key comes from Key Vault.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-k8s-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: ~3
    helm:
      releaseName: grafana-k8s-monitoring
      valuesObject:
        cluster:
          name: azrc-seas-dev-aks-001

        destinations:
          - name: grafana-cloud-metrics
            type: prometheus
            url: https://prometheus-prod-13-prod-us-east-0.grafana.net./api/prom/push
            auth:
              type: basic
              usernameKey: username-metrics
            secret:
              create: false
              name: grafana-cloud-credentials
              namespace: grafana-monitoring

          - name: grafana-cloud-logs
            type: loki
            url: https://logs-prod-006.grafana.net./loki/api/v1/push
            auth:
              type: basic
              usernameKey: username-logs
            secret:
              create: false
              name: grafana-cloud-credentials
              namespace: grafana-monitoring

          - name: gc-otlp-endpoint
            type: otlp
            url: https://otlp-gateway-prod-us-east-0.grafana.net./otlp
            protocol: http
            auth:
              type: basic
              usernameKey: username-otlp
            secret:
              create: false
              name: grafana-cloud-credentials
              namespace: grafana-monitoring
            metrics:
              enabled: true
            logs:
              enabled: true
            traces:
              enabled: true

          - name: grafana-cloud-profiles
            type: pyroscope
            url: https://profiles-prod-001.grafana.net.:443
            auth:
              type: basic
              usernameKey: username-profiles
            secret:
              create: false
              name: grafana-cloud-credentials
              namespace: grafana-monitoring

        clusterMetrics:
          enabled: true
          opencost:
            enabled: true
            metricsSource: grafana-cloud-metrics
            opencost:
              exporter:
                defaultClusterId: azrc-seas-dev-aks-001
              prometheus:
                existingSecretName: grafana-cloud-credentials
                username_key: username-metrics
                external:
                  url: https://prometheus-prod-13-prod-us-east-0.grafana.net./api/prom
            podAnnotations:
              kubernetes.azure.com/set-kube-service-host-fqdn: "true"
          kepler:
            enabled: true
          kube-state-metrics:
            podAnnotations:
              kubernetes.azure.com/set-kube-service-host-fqdn: "true"

        clusterEvents:
          enabled: true

        nodeLogs:
          enabled: true

        podLogs:
          enabled: true

        applicationObservability:
          enabled: true
          receivers:
            otlp:
              grpc:
                enabled: true
                port: 4317
              http:
                enabled: true
                port: 4318
            zipkin:
              enabled: true
              port: 9411

        autoInstrumentation:
          enabled: true
          beyla:
            deliverTracesToApplicationObservability: false

        profiling:
          enabled: true

        # -- Alloy Metrics collector
        alloy-metrics:
          enabled: true
          controller:
            podAnnotations:
              kubernetes.azure.com/set-kube-service-host-fqdn: "true"
          alloy:
            extraEnv:
              - name: GCLOUD_RW_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: grafana-cloud-credentials
                    key: password
              - name: CLUSTER_NAME
                value: azrc-seas-dev-aks-001
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: GCLOUD_FM_COLLECTOR_ID
                value: grafana-k8s-monitoring-$(CLUSTER_NAME)-$(NAMESPACE)-$(POD_NAME)
          remoteConfig:
            enabled: true
            url: https://fleet-management-prod-008.grafana.net
            auth:
              type: basic
              usernameKey: username-otlp
            secret:
              create: false
              name: grafana-cloud-credentials
              namespace: grafana-monitoring

        # -- Alloy Singleton collector
        alloy-singleton:
          enabled: true
          controller:
            podAnnotations:
              kubernetes.azure.com/set-kube-service-host-fqdn: "true"
          alloy:
            extraEnv:
              - name: GCLOUD_RW_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: grafana-cloud-credentials
                    key: password
              - name: CLUSTER_NAME
                value: azrc-seas-dev-aks-001
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: GCLOUD_FM_COLLECTOR_ID
                value: grafana-k8s-monitoring-$(CLUSTER_NAME)-$(NAMESPACE)-$(POD_NAME)
          remoteConfig:
            enabled: true
            url: https://fleet-management-prod-008.grafana.net
            auth:
              type: basic
              usernameKey: username-otlp
            secret:
              create: false
              name: grafana-cloud-credentials
              namespace: grafana-monitoring

        # -- Alloy Logs collector
        alloy-logs:
          enabled: true
          controller:
            podAnnotations:
              kubernetes.azure.com/set-kube-service-host-fqdn: "true"
          alloy:
            extraEnv:
              - name: GCLOUD_RW_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: grafana-cloud-credentials
                    key: password
              - name: CLUSTER_NAME
                value: azrc-seas-dev-aks-001
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              - name: GCLOUD_FM_COLLECTOR_ID
                value: grafana-k8s-monitoring-$(CLUSTER_NAME)-$(NAMESPACE)-alloy-logs-$(NODE_NAME)
          remoteConfig:
            enabled: true
            url: https://fleet-management-prod-008.grafana.net
            auth:
              type: basic
              usernameKey: username-otlp
            secret:
              create: false
              name: grafana-cloud-credentials
              namespace: grafana-monitoring

        # -- Alloy Receiver collector
        alloy-receiver:
          enabled: true
          alloy:
            extraPorts:
              - name: otlp-grpc
                port: 4317
                targetPort: 4317
                protocol: TCP
              - name: otlp-http
                port: 4318
                targetPort: 4318
                protocol: TCP
              - name: zipkin
                port: 9411
                targetPort: 9411
                protocol: TCP
            extraEnv:
              - name: GCLOUD_RW_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: grafana-cloud-credentials
                    key: password
              - name: CLUSTER_NAME
                value: azrc-seas-dev-aks-001
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              - name: GCLOUD_FM_COLLECTOR_ID
                value: grafana-k8s-monitoring-$(CLUSTER_NAME)-$(NAMESPACE)-alloy-receiver-$(NODE_NAME)
          controller:
            podAnnotations:
              kubernetes.azure.com/set-kube-service-host-fqdn: "true"
          remoteConfig:
            enabled: true
            url: https://fleet-management-prod-008.grafana.net
            auth:
              type: basic
              usernameKey: username-otlp
            secret:
              create: false
              name: grafana-cloud-credentials
              namespace: grafana-monitoring

        # -- Alloy Profiles collector
        alloy-profiles:
          enabled: true
          controller:
            podAnnotations:
              kubernetes.azure.com/set-kube-service-host-fqdn: "true"
          alloy:
            extraEnv:
              - name: GCLOUD_RW_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: grafana-cloud-credentials
                    key: password
              - name: CLUSTER_NAME
                value: azrc-seas-dev-aks-001
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              - name: GCLOUD_FM_COLLECTOR_ID
                value: grafana-k8s-monitoring-$(CLUSTER_NAME)-$(NAMESPACE)-alloy-profiles-$(NODE_NAME)
          remoteConfig:
            enabled: true
            url: https://fleet-management-prod-008.grafana.net
            auth:
              type: basic
              usernameKey: username-otlp
            secret:
              create: false
              name: grafana-cloud-credentials
              namespace: grafana-monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: grafana-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
